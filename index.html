<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EXIF 透かしツール</title>
<style>
  :root {
    --bg: #0e0f12;
    --panel: #16181d;
    --panel-2: #1d2026;
    --border: #2a2e37;
    --text: #e8eaed;
    --muted: #9aa0aa;
    --accent: #e60012; /* Leica red */
    --accent-2: #4a9eff;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: .02em; }
  header .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  header .sub { color: var(--muted); font-size: 12px; margin-left: auto; }

  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 0; min-height: calc(100vh - 61px); }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .sidebar {
    padding: 20px; border-right: 1px solid var(--border);
    background: var(--panel); overflow-y: auto;
  }
  .main { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

  .drop {
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 28px 16px; text-align: center; color: var(--muted);
    cursor: pointer; transition: .15s; background: var(--panel-2);
  }
  .drop:hover, .drop.over { border-color: var(--accent-2); color: var(--text); background: #1a2230; }
  .drop strong { color: var(--text); display: block; margin-bottom: 4px; }
  .drop small { font-size: 11px; }

  .section { margin-top: 20px; }
  .section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input[type=text], .field select {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px;
  }
  .field input[type=range] { width: 100%; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button {
    flex: 1; min-width: 70px; background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 12px; cursor: pointer;
  }
  .seg button.active { background: var(--accent-2); color: #fff; border-color: var(--accent-2); }

  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent-2); }

  .btn {
    width: 100%; padding: 11px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 600;
  }
  .btn-primary { background: var(--accent-2); color: #fff; }
  .btn-primary:hover { background: #3a8eef; }
  .btn-ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .preview-wrap {
    flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center; padding: 20px; min-height: 360px;
    background-image:
      linear-gradient(45deg, #1a1c22 25%, transparent 25%),
      linear-gradient(-45deg, #1a1c22 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1a1c22 75%),
      linear-gradient(-45deg, transparent 75%, #1a1c22 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  }
  .preview-wrap canvas { max-width: 100%; max-height: 70vh; border-radius: 4px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .placeholder { color: var(--muted); text-align: center; }

  .thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .thumb {
    position: relative; flex: 0 0 auto; width: 74px; height: 74px; border-radius: 8px; overflow: hidden;
    border: 2px solid transparent; cursor: pointer; background: var(--panel-2);
  }
  .thumb.active { border-color: var(--accent-2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .x {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,.6); color: #fff; font-size: 12px; line-height: 18px; text-align: center;
  }

  .exif-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; }
  .exif-grid .k { color: var(--muted); }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar .count { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>EXIF 透かしツール</h1>
  <span class="sub">完全ローカル処理 / 画質を維持したまま透かしを追加</span>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="drop" id="drop">
      <strong>写真をドラッグ＆ドロップ</strong>
      <small>またはクリックして選択（複数可・JPEG推奨）</small>
      <input type="file" id="file" accept="image/*" multiple hidden />
    </div>

    <div class="section">
      <h2>スタイル</h2>
      <div class="seg" id="styleSeg">
        <button data-style="frame" class="active">白フチ枠</button>
        <button data-style="overlay">オーバーレイ</button>
      </div>
    </div>

    <div class="section">
      <h2>表示する情報</h2>
      <label class="check"><input type="checkbox" id="optMaker" checked /> メーカー / 機種名</label>
      <label class="check" style="margin-top:8px"><input type="checkbox" id="optParams" checked /> 撮影パラメータ (焦点距離・F値・SS・ISO)</label>
      <label class="check" style="margin-top:8px"><input type="checkbox" id="optDate" checked /> 撮影日時</label>
      <label class="check" style="margin-top:8px"><input type="checkbox" id="optLogo" checked /> メーカーロゴ（自動判別）</label>
    </div>

    <div class="section">
      <h2>テキスト調整（任意・上書き）</h2>
      <div class="field">
        <label>メーカー</label>
        <input type="text" id="txtMaker" placeholder="自動 (EXIF)" />
      </div>
      <div class="field">
        <label>機種名</label>
        <input type="text" id="txtModel" placeholder="自動 (EXIF)" />
      </div>
    </div>

    <div class="section">
      <h2>書き出し</h2>
      <div class="field">
        <label>形式</label>
        <div class="seg" id="fmtSeg">
          <button data-fmt="image/jpeg" class="active">JPEG</button>
          <button data-fmt="image/png">PNG（無劣化）</button>
        </div>
      </div>
      <div class="field" id="qualityField">
        <label>JPEG品質 <span id="qVal">96</span></label>
        <input type="range" id="quality" min="70" max="100" value="96" />
      </div>
      <div class="field">
        <label>透かしサイズ <span id="sVal">100%</span></label>
        <input type="range" id="scale" min="60" max="160" value="100" />
      </div>
      <div class="field" id="borderField">
        <label>白フチの太さ <span id="bVal">標準（Xiaomi準拠）</span></label>
        <input type="range" id="border" min="0" max="250" value="100" />
      </div>
    </div>

    <button class="btn btn-primary" id="dlOne" disabled>この写真を保存</button>
    <button class="btn btn-ghost" id="dlAll" disabled style="margin-top:8px">すべて一括保存</button>
  </aside>

  <main class="main">
    <div class="thumbs" id="thumbs"></div>
    <div class="preview-wrap" id="previewWrap">
      <div class="placeholder" id="placeholder">
        写真を読み込むとここにプレビューが表示されます
      </div>
      <canvas id="canvas" style="display:none"></canvas>
    </div>
    <div class="toolbar">
      <span class="count" id="exifInfo">EXIF情報なし</span>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>

function makerKey(make, model) {
  const s = ((make || '') + ' ' + (model || '')).toLowerCase();
  const table = [
    ['nikon','nikon'],['sony','sony'],['fujifilm','fujifilm'],['fuji','fujifilm'],
    ['apple','apple'],['iphone','apple'],['ipad','apple'],
    ['samsung','samsung'],['galaxy','samsung'],
    ['xiaomi','xiaomi'],['redmi','xiaomi'],['poco','xiaomi'],
    ['google','google'],['pixel','google'],
    ['huawei','huawei'],['leica','leica'],
    ['panasonic','panasonic'],['lumix','panasonic'],
    ['dji','dji'],['oneplus','oneplus'],['oppo','oppo'],['vivo','vivo'],
    ['motorola','motorola'],['moto ','motorola'],['asus','asus'],['zenfone','asus'],
  ];
  for (const [kw, key] of table) if (s.includes(kw)) return key;
  return null;
}

// ロゴを指定色で描画した画像を生成し、余白を自動トリミングしてキャッシュ
const logoCache = {};
function ensureLogo(key, color) {
  const id = key + '|' + color;
  if (logoCache[id]) return logoCache[id];
  const def = LOGOS[key];
  if (!def) return null;
  const rec = { ready: false, img: null, box: null };
  logoCache[id] = rec;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="${def.vb}"><path fill="${color}" d="${def.d}"/></svg>`;
  const img = new Image();
  img.onload = () => {
    const S = 240;
    const oc = document.createElement('canvas'); oc.width = S; oc.height = S;
    const octx = oc.getContext('2d');
    octx.drawImage(img, 0, 0, S, S);
    let data;
    try { data = octx.getImageData(0, 0, S, S).data; } catch { data = null; }
    let minX = S, minY = S, maxX = 0, maxY = 0, found = false;
    if (data) {
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        if (data[(y * S + x) * 4 + 3] > 12) { found = true; if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
      }
    }
    rec.img = img;
    rec.box = found ? { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 } : { x: 0, y: 0, w: S, h: S };
    rec.ready = true;
    render();
  };
  img.onerror = () => { rec.ready = true; rec.box = null; };
  img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  return rec;
}

/* ---------- ファイル読み込み ---------- */
const drop = $('#drop'), fileInput = $('#file');
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

async function handleFiles(fileList) {
  const imgs = [...fileList].filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return;
  for (const f of imgs) {
    try {
      const [img, exif] = await Promise.all([loadImage(f), parseExif(f)]);
      state.files.push({ name: f.name, img, exif, override: { maker: '', model: '' } });
    } catch (err) {
      console.error(err);
      toast('読み込み失敗: ' + f.name);
    }
  }
  if (state.active < 0 && state.files.length) state.active = 0;
  renderThumbs();
  selectActive(state.active);
}

function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { res(img); };
    img.onerror = rej;
    img.src = url;
  });
}

async function parseExif(file) {
  try {
    const d = await exifr.parse(file, {
      pick: ['Make','Model','DateTimeOriginal','CreateDate','FNumber','ExposureTime','ISO','ISOSpeedRatings','FocalLength','FocalLengthIn35mmFormat','LensModel']
    });
    return d || {};
  } catch { return {}; }
}

/* ---------- サムネイル ---------- */
function renderThumbs() {
  const wrap = $('#thumbs');
  wrap.innerHTML = '';
  state.files.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'thumb' + (i === state.active ? ' active' : '');
    div.innerHTML = `<img src="${f.img.src}" /><div class="x">×</div>`;
    div.querySelector('img').onclick = () => selectActive(i);
    div.querySelector('.x').onclick = (e) => { e.stopPropagation(); removeFile(i); };
    wrap.appendChild(div);
  });
}

function removeFile(i) {
  state.files.splice(i, 1);
  if (state.active >= state.files.length) state.active = state.files.length - 1;
  renderThumbs();
  if (state.active >= 0) selectActive(state.active); else clearPreview();
}

function clearPreview() {
  canvas.style.display = 'none';
  $('#placeholder').style.display = '';
  $('#exifInfo').textContent = 'EXIF情報なし';
  $('#dlOne').disabled = $('#dlAll').disabled = true;
}

function selectActive(i) {
  state.active = i;
  if (i < 0) { clearPreview(); return; }
  const f = state.files[i];
  $('#txtMaker').value = f.override.maker;
  $('#txtModel').value = f.override.model;
  renderThumbs();
  render();
  $('#dlOne').disabled = false;
  $('#dlAll').disabled = state.files.length === 0;
}

/* ---------- EXIF 整形 ---------- */
function fmtShutter(t) {
  if (t == null) return null;
  if (t >= 1) return t + 's';
  const denom = Math.round(1 / t);
  return '1/' + denom + 's';
}
function fmtDate(d) {
  if (!d) return null;
  const dt = (d instanceof Date) ? d : new Date(d);
  if (isNaN(dt)) return null;
  const p = (n) => String(n).padStart(2, '0');
  return `${dt.getFullYear()}.${p(dt.getMonth()+1)}.${p(dt.getDate())} ${p(dt.getHours())}:${p(dt.getMinutes())}`;
}
function getInfo(f) {
  const e = f.exif || {};
  const maker = (f.override.maker || e.Make || '').trim();
  const model = (f.override.model || e.Model || '').trim();
  const params = [];
  const focal = e.FocalLengthIn35mmFormat || e.FocalLength;
  if (focal) params.push(Math.round(focal) + 'mm');
  if (e.FNumber) params.push('f/' + (Math.round(e.FNumber * 10) / 10));
  const ss = fmtShutter(e.ExposureTime);
  if (ss) params.push(ss);
  const iso = e.ISO || e.ISOSpeedRatings;
  if (iso) params.push('ISO' + iso);
  const date = fmtDate(e.DateTimeOriginal || e.CreateDate);
  return { maker, model, params: params.join('  '), date, logoKey: makerKey(maker, model) };
}

/* ---------- 描画 ---------- */
function render() {
  if (state.active < 0) return;
  const f = state.files[state.active];
  const img = f.img;
  const info = getInfo(f);
  const show = state.show;

  // EXIFパネル表示
  const e = f.exif || {};
  $('#exifInfo').textContent = info.maker || info.model
    ? `${info.maker} ${info.model}  ${info.params}  ${info.date || ''}`.trim()
    : 'EXIF情報が見つかりませんでした（テキスト調整欄で手入力できます）';

  const iw = img.naturalWidth, ih = img.naturalHeight;
  const base = Math.min(iw, ih);
  const k = state.scale;

  if (state.style === 'frame') {
    // Xiaomi 画框（白フレーム）比率に準拠。縦横どちらでも見た目を揃えるため
    // 短辺(base)を基準にする：上・左右の白フチ ≒ 短辺の2.2%（state.border で調整）/ 下部バー ≒ 短辺の12.5%
    const side = Math.round(base * 0.022 * state.border);
    const bar = Math.round(base * 0.125 * k);
    const W = iw + side * 2;
    const H = ih + side + bar;
    canvas.width = W; canvas.height = H;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(img, side, side, iw, ih);
    drawBarText(ctx, info, side, ih + side, iw, bar, '#1a1a1a', '#888', false);
  } else {
    // オーバーレイ（写真の上に直接）
    canvas.width = iw; canvas.height = ih;
    ctx.drawImage(img, 0, 0, iw, ih);
    const bar = Math.round(base * 0.13 * k);
    // 下部にグラデーションの影
    const grad = ctx.createLinearGradient(0, ih - bar * 1.6, 0, ih);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, ih - bar * 1.6, iw, bar * 1.6);
    const pad = Math.round(iw * 0.03);
    drawBarText(ctx, info, pad, ih - bar, iw - pad * 2, bar, '#ffffff', 'rgba(255,255,255,.75)', true);
  }

  canvas.style.display = '';
  $('#placeholder').style.display = 'none';
}

function drawBarText(ctx, info, x, y, w, h, colorMain, colorSub, overlay) {
  const show = state.show;
  const cy = y + h / 2;
  const fontMain = Math.round(h * (overlay ? 0.30 : 0.26));
  const fontSub  = Math.round(h * (overlay ? 0.20 : 0.17));
  const fam = '-apple-system, "Helvetica Neue", Arial, sans-serif';

  // 左：メーカーロゴ + 機種
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  let leftX = x + Math.round(h * 0.18);
  let drewLogo = false;

  if (show.logo && info.logoKey) {
    const rec = ensureLogo(info.logoKey, colorMain);
    if (rec && rec.ready && rec.box) {
      const b = rec.box;
      let lh = fontMain * 1.05;            // 機種名テキストとほぼ同じ高さ
      let lw = lh * b.w / b.h;
      const maxW = w * 0.40;
      if (lw > maxW) { lw = maxW; lh = lw * b.h / b.w; }
      ctx.drawImage(rec.img, b.x, b.y, b.w, b.h, leftX, cy - lh / 2, lw, lh);
      leftX += lw + Math.round(h * 0.14);
      drewLogo = true;
    }
  }

  const hasLeft = drewLogo || show.maker;
  if (show.maker) {
    const model = info.model || (drewLogo ? '' : 'カメラ');
    if (drewLogo) {
      // ロゴ有り：機種名のみ1行（ロゴがメーカーを表す）
      if (model) {
        ctx.fillStyle = colorMain;
        ctx.font = `600 ${Math.round(fontMain * 0.92)}px ${fam}`;
        ctx.fillText(model, leftX, cy);
      }
    } else {
      // ロゴ無し：機種名(太) + メーカー(小)
      ctx.fillStyle = colorMain;
      ctx.font = `700 ${fontMain}px ${fam}`;
      ctx.fillText(model, leftX, cy - (info.maker ? fontSub * 0.75 : 0));
      if (info.maker) {
        ctx.fillStyle = colorSub;
        ctx.font = `500 ${fontSub}px ${fam}`;
        ctx.fillText(info.maker.toUpperCase(), leftX, cy + fontMain * 0.62);
      }
    }
  }

  // 右：パラメータ + 日付（縦線の区切り付き）
  ctx.textAlign = 'right';
  let rightX = x + w - Math.round(h * 0.18);
  const lines = [];
  if (show.params && info.params) lines.push({ t: info.params, f: `600 ${fontMain * 0.82}px ${fam}`, c: colorMain });
  if (show.date && info.date)     lines.push({ t: info.date,   f: `500 ${fontSub}px ${fam}`,      c: colorSub });

  if (lines.length === 1) {
    ctx.font = lines[0].f; ctx.fillStyle = lines[0].c;
    ctx.fillText(lines[0].t, rightX, cy);
  } else if (lines.length === 2) {
    ctx.font = lines[0].f; ctx.fillStyle = lines[0].c;
    ctx.fillText(lines[0].t, rightX, cy - fontSub * 0.75);
    ctx.font = lines[1].f; ctx.fillStyle = lines[1].c;
    ctx.fillText(lines[1].t, rightX, cy + fontMain * 0.55);
  }

  // 区切りの縦線（左右両方に内容がある場合）
  if (lines.length && hasLeft) {
    // 右テキストの最大幅を測って線を引く
    ctx.font = lines[0].f;
    let maxW = 0;
    lines.forEach(l => { ctx.font = l.f; maxW = Math.max(maxW, ctx.measureText(l.t).width); });
    const lineX = rightX - maxW - Math.round(h * 0.22);
    ctx.strokeStyle = overlay ? 'rgba(255,255,255,.4)' : '#ddd';
    ctx.lineWidth = Math.max(1, Math.round(h * 0.015));
    ctx.beginPath();
    ctx.moveTo(lineX, cy - h * 0.28);
    ctx.lineTo(lineX, cy + h * 0.28);
    ctx.stroke();
  }
}

/* ---------- コントロール ---------- */
$('#styleSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.style = b.dataset.style;
  [...$('#styleSeg').children].forEach(c => c.classList.toggle('active', c === b));
  $('#borderField').style.display = state.style === 'frame' ? '' : 'none';
  render();
});
$('#fmtSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.format = b.dataset.fmt;
  [...$('#fmtSeg').children].forEach(c => c.classList.toggle('active', c === b));
  $('#qualityField').style.display = state.format === 'image/jpeg' ? '' : 'none';
});
$('#quality').addEventListener('input', e => { state.quality = e.target.value / 100; $('#qVal').textContent = e.target.value; });
$('#scale').addEventListener('input', e => { state.scale = e.target.value / 100; $('#sVal').textContent = e.target.value + '%'; render(); });
$('#border').addEventListener('input', e => {
  const v = +e.target.value;
  state.border = v / 100;
  const pct = (0.022 * state.border * 100).toFixed(1);
  $('#bVal').textContent = v === 0 ? 'なし' : (v === 100 ? '標準（Xiaomi準拠）' : `短辺の${pct}%`);
  render();
});

[['optMaker','maker'],['optParams','params'],['optDate','date'],['optLogo','logo']].forEach(([id,key]) => {
  $('#'+id).addEventListener('change', e => { state.show[key] = e.target.checked; render(); });
});
$('#txtMaker').addEventListener('input', e => { if (state.active>=0){ state.files[state.active].override.maker = e.target.value; render(); }});
$('#txtModel').addEventListener('input', e => { if (state.active>=0){ state.files[state.active].override.model = e.target.value; render(); }});

/* ---------- 保存 ---------- */
function outName(name) {
  const dot = name.lastIndexOf('.');
  const stem = dot > 0 ? name.slice(0, dot) : name;
  const ext = state.format === 'image/png' ? 'png' : 'jpg';
  return `${stem}_wm.${ext}`;
}
function downloadCanvas(name) {
  return new Promise(res => {
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = outName(name);
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      res();
    }, state.format, state.format === 'image/jpeg' ? state.quality : undefined);
  });
}
$('#dlOne').addEventListener('click', async () => {
  if (state.active < 0) return;
  await downloadCanvas(state.files[state.active].name);
  toast('保存しました');
});
$('#dlAll').addEventListener('click', async () => {
  const keep = state.active;
  for (let i = 0; i < state.files.length; i++) {
    state.active = i; render();
    await new Promise(r => setTimeout(r, 60));
    await downloadCanvas(state.files[i].name);
    await new Promise(r => setTimeout(r, 120));
  }
  state.active = keep; render();
  toast(`${state.files.length}枚を保存しました`);
});

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
